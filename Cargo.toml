[package]
name = "makestem"
version = "0.1.3"
edition = "2024"
description = "Create DJ-ready acapellas and instrumentals with Demucs and FFmpeg"
license = "MIT"

[[bin]]
name = "makestem"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
