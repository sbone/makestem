[package]
name = "makestem"
version = "0.1.6"
edition = "2024"
description = "Create DJ-ready acapellas and instrumentals with Demucs and FFmpeg"
license = "MIT"
repository = "https://github.com/sbone/makestem"
homepage = "https://github.com/sbone/makestem"
readme = "README.md"

[[bin]]
name = "makestem"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
id3 = { version = "1.17.0", default-features = false }
indicatif = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
